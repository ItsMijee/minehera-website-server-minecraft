<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrimVerse</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <!-- SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("bO88rhPlS3j_wWWSY"); // Public Key
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121019;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .fullscreen-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .server-header {
            text-align: center;
            margin-bottom: 4px;
        }

        .server-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            color: #c084fc;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .info-notice {
            background: rgba(126, 34, 206, 0.1);
            border-left: 3px solid #a855f7;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            color: #d8b4fe;
            line-height: 1.5;
        }

        .tab-box {
            display: flex;
            background: #1a1625;
            border-radius: 10px;
            padding: 4px;
            border: 1px solid #2d2640;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 10px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #7e22ce;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
        }

        .form-box {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .form-box.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1625;
            border: 1px solid #2d2640;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .input-group select {
            cursor: pointer;
        }

        .bedrock-input-wrapper {
            display: flex;
            align-items: center;
            background: #1a1625;
            border: 1px solid #2d2640;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bedrock-input-wrapper:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .fixed-dot {
            padding-left: 16px;
            color: #a855f7;
            font-weight: bold;
            font-size: 16px;
            user-select: none;
        }

        .bedrock-input-wrapper input {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding-left: 4px;
        }

        .platform-note {
            font-size: 11px;
            color: #6b7280;
            margin-top: -2px;
        }

        .admin-checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #9ca3af;
            cursor: pointer;
            user-select: none;
        }

        .admin-checkbox-group input {
            accent-color: #7e22ce;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7e22ce;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);
            margin-top: 4px;
        }

        .submit-btn:hover {
            background: #6b21a8;
        }

        .otp-row {
            display: flex;
            gap: 8px;
        }

        .otp-btn {
            padding: 0 16px;
            background: #2d2640;
            border: 1px solid #a855f7;
            color: #d8b4fe;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.3s;
            white-space: nowrap;
        }

        .otp-btn:hover {
            background: #7e22ce;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="fullscreen-wrapper">
        <div class="server-header">
            <h2>GrimVerse</h2>
        </div>

        <div class="info-notice">
            <strong>Perhatian:</strong> Hanya bisa memiliki 1 akun dalam 1 perangkat. Pastikan memasukkan email dan username dengan benar.
        </div>

        <div class="tab-box">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="form-box active" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Pilih Platform</label>
                <select id="loginPlatform" onchange="handlePlatformChange('login')">
                    <option value="java">Java Edition</option>
                    <option value="bedrock">Bedrock Edition</option>
                </select>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUsernameJava" placeholder="Masukkan username..." required>
                <div class="bedrock-input-wrapper hidden" id="loginUsernameBedrockWrapper">
                    <span class="fixed-dot">.</span>
                    <input type="text" id="loginUsernameBedrock" placeholder="Masukkan username...">
                </div>
                <span class="platform-note" id="loginPlatformNote">Gunakan username akun Java kamu.</span>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <div class="admin-checkbox-group" onclick="document.getElementById('adminCheck').click(); event.stopPropagation();">
                <input type="checkbox" id="adminCheck" onclick="toggleAdminCode(event)">
                <label for="adminCheck" style="margin-bottom: 0; cursor: pointer;">Login sebagai Admin</label>
            </div>

            <div class="input-group hidden" id="adminCodeGroup">
                <label>Kode Akses Admin</label>
                <input type="password" id="adminCodeInput" placeholder="Masukkan kode rahasia...">
            </div>

            <button type="submit" class="submit-btn">LOGIN</button>
        </form>

        <!-- Form Register -->
        <form id="registerForm" class="form-box" onsubmit="handleRegister(event)">
            <div class="input-group">
                <label>Pilih Platform</label>
                <select id="registerPlatform" onchange="handlePlatformChange('register')">
                    <option value="java">Java Edition</option>
                    <option value="bedrock">Bedrock Edition</option>
                </select>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="registerUsernameJava" placeholder="Masukkan username..." required>
                <div class="bedrock-input-wrapper hidden" id="registerUsernameBedrockWrapper">
                    <span class="fixed-dot">.</span>
                    <input type="text" id="registerUsernameBedrock" placeholder="Masukkan username...">
                </div>
                <span class="platform-note" id="registerPlatformNote">Gunakan username akun Java kamu.</span>
            </div>

            <div class="input-group">
                <label>Email</label>
                <div class="otp-row">
                    <input type="email" id="regEmail" placeholder="nama@email.com" required style="flex: 1;">
                    <button type="button" class="otp-btn" onclick="sendOtpCode()">Kirim Kode</button>
                </div>
            </div>

            <div class="input-group">
                <label>Kode Verifikasi (Cek Email)</label>
                <input type="text" id="regOtpInput" placeholder="Masukkan 6 digit kode..." required>
            </div>
            
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="regPass" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirmPass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">REGISTER</button>
        </form>
    </div>

    <script>
        let generatedOtp = '';

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const btns = document.querySelectorAll('.tab-btn');

            btns.forEach(btn => btn.classList.remove('active'));

            if (tab === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                event.target.classList.add('active');
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                event.target.classList.add('active');
            }
        }

        function handlePlatformChange(formType) {
            const platform = document.getElementById(formType + 'Platform').value;
            const javaInput = document.getElementById(formType + 'UsernameJava');
            const bedrockWrapper = document.getElementById(formType + 'UsernameBedrockWrapper');
            const bedrockInput = document.getElementById(formType + 'UsernameBedrock');
            const note = document.getElementById(formType + 'PlatformNote');

            if (platform === 'bedrock') {
                javaInput.classList.add('hidden');
                javaInput.removeAttribute('required');
                
                bedrockWrapper.classList.remove('hidden');
                bedrockInput.setAttribute('required', 'true');
                
                note.textContent = 'Akun Bedrock otomatis diawali dengan tanda titik (.) dari server.';
            } else {
                bedrockWrapper.classList.add('hidden');
                bedrockInput.removeAttribute('required');
                
                javaInput.classList.remove('hidden');
                javaInput.setAttribute('required', 'true');
                
                note.textContent = 'Gunakan username akun Java kamu.';
            }
        }

        function toggleAdminCode(event) {
            event.stopPropagation();
            const adminCheck = document.getElementById('adminCheck');
            const adminCodeGroup = document.getElementById('adminCodeGroup');
            
            if (adminCheck.checked) {
                adminCodeGroup.classList.remove('hidden');
            } else {
                adminCodeGroup.classList.add('hidden');
                document.getElementById('adminCodeInput').value = '';
            }
        }

        // Fungsi Kirim OTP menggunakan EmailJS
        function sendOtpCode() {
            const email = document.getElementById('regEmail').value;
            if (!email) {
                alert('Silakan masukkan alamat email terlebih dahulu!');
                return;
            }

            // Buat kode acak 6 digit
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

            const templateParams = {
                to_email: email,
                otp_code: generatedOtp
            };

            emailjs.send('service_y9oblcs', 'template_9qs2nj3', templateParams)
                .then(function(response) {
                    alert('Kode verifikasi berhasil dikirim ke ' + email);
                }, function(error) {
                    alert('Gagal mengirim email. Periksa koneksi atau konfigurasi EmailJS.');
                    console.error('FAILED...', error);
                });
        }

        function handleLogin(e) {
            e.preventDefault();
            const adminCheck = document.getElementById('adminCheck');
            const adminCodeInput = document.getElementById('adminCodeInput').value;

            if (adminCheck.checked) {
                if (adminCodeInput !== 'GVPROJECT2026') {
                    alert('Kode Akses Admin salah!');
                    return;
                }
            }
            alert('Login Berhasil!');
        }

        function handleRegister(e) {
            e.preventDefault();
            const userOtp = document.getElementById('regOtpInput').value;
            const pass = document.getElementById('regPass').value;
            const confirmPass = document.getElementById('regConfirmPass').value;

            if (pass !== confirmPass) {
                alert('Konfirmasi password tidak cocok!');
                return;
            }

            if (userOtp !== generatedOtp) {
                alert('Kode verifikasi salah atau belum dikirim!');
                return;
            }

            alert('Registrasi Berhasil! Akun terdaftar dan perangkat ini telah dikunci.');
        }
    </script>
</body>
</html>
